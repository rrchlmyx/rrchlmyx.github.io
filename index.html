<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CBSS业务支撑系统3.0</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--line:#e4e8f0;--text:#1f2a3d;--muted:#7a8699;--pri:#2f6bff;--pri2:#e8efff;--ok:#16a34a;--warn:#e88a00;--bad:#dc2626;--side:#14213d;--sideText:#c9d3e6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:var(--pri);cursor:pointer;text-decoration:none}
#app{display:flex;min-height:100vh}
#side{width:220px;background:var(--side);color:var(--sideText);flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
#side .brand{padding:18px 18px 12px;font-weight:700;color:#fff;font-size:16px;line-height:1.4}
#side .brand small{display:block;font-weight:400;color:#8fa0bf;font-size:12px}
#side .grp{padding:12px 18px 4px;font-size:12px;color:#7083a6}
#side .nav{display:block;padding:9px 18px 9px 22px;color:var(--sideText);border-left:3px solid transparent}
#side .nav:hover{background:#1d2d50}
#side .nav.on{background:#203463;color:#fff;border-left-color:#5b8cff}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:12px;position:sticky;top:0;z-index:5}
#top h1{font-size:17px;margin:0;flex:1}
#menuBtn{display:none;border:0;background:none;font-size:22px;cursor:pointer}
.op-sel{display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.tag-sim{background:#fff4e0;color:#a35b00;border:1px solid #f6d29b;border-radius:10px;padding:2px 8px;font-size:12px;white-space:nowrap}
#content{padding:18px;max-width:1400px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .l{color:var(--muted);font-size:12px}.kpi .v{font-size:24px;font-weight:700;margin-top:6px}.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f7f9fc;color:#56627a;font-weight:600}
tr:hover td{background:#fafbff}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;line-height:1.3}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{opacity:.9;color:#fff}
.btn.d{color:var(--bad);border-color:#f3c0c0}.btn.s{padding:3px 8px;font-size:12px}
.btn+.btn{margin-left:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#eef1f6;color:#56627a}
.b-ok{background:#e7f7ec;color:var(--ok)}.b-warn{background:#fff3e0;color:var(--warn)}.b-bad{background:#fdecec;color:var(--bad)}.b-pri{background:var(--pri2);color:var(--pri)}
.muted{color:var(--muted)}.right{text-align:right}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar .btn+.btn{margin-left:0}
input,select,textarea{font:inherit;border:1px solid #cfd6e3;border-radius:6px;padding:7px 9px;background:#fff;color:var(--text);max-width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px var(--pri2)}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.form .f{display:flex;flex-direction:column;gap:5px;min-width:0}.form .f>input,.form .f>select,.form .f>textarea{width:100%;box-sizing:border-box}.plchk{display:flex;flex-wrap:wrap;gap:6px 16px;max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px 10px}.plchk label{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:inherit;cursor:pointer;max-width:100%}.plchk input{width:auto;margin:0}.form .f.full{grid-column:1/-1}
.form label{font-size:12px;color:#56627a}
#mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 12px}
#modal{background:#fff;border-radius:12px;width:680px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2)}
#modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex}
#modal .mh span{flex:1}#modal .mb{padding:18px;max-height:70vh;overflow:auto}#modal .mf{padding:12px 18px;border-top:1px solid var(--line);text-align:right}
#toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#1f2a3d;color:#fff;padding:9px 16px;border-radius:8px;z-index:99;display:none;max-width:90vw}
.items-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.items-row select{flex:1;min-width:0}
.form select,.toolbar select{max-width:100%;min-width:0;text-overflow:ellipsis}.items-row input{width:80px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}
.bar .bl{width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .bt{flex:1;background:#eef1f6;border-radius:4px;height:14px;overflow:hidden}.bar .bf{height:100%;background:var(--pri)}
.donut{width:130px;height:130px;border-radius:50%;position:relative;flex-shrink:0}
.donut:after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.legend div{font-size:12px;margin:4px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px}.kv>div:nth-child(odd){color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs a{padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent}.tabs a.on{color:var(--pri);border-bottom-color:var(--pri)}
.note{background:#f7f9fc;border:1px dashed #cfd6e3;border-radius:8px;padding:10px 12px;color:#56627a;font-size:12px;line-height:1.7}
.chips span{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:10px;padding:1px 8px;font-size:12px;margin:2px 4px 2px 0}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
@media (max-width:760px){
 #side{position:fixed;left:-240px;z-index:40;transition:left .2s;width:230px}
 #side.open{left:0;box-shadow:0 0 30px rgba(0,0,0,.4)}
 #menuBtn{display:block}#content{padding:12px}
 .form{grid-template-columns:minmax(0,1fr)}
 #top{padding:0 10px}#top h1{font-size:15px}#curMonth{display:none}.op-l{display:none}#opSel select{max-width:120px!important;font-size:12px}.tag-sim{font-size:11px;padding:1px 6px}
 .kpi .v{font-size:20px}
}
</style>
</head>
<body>
<div id="app">
 <aside id="side"></aside>
 <div id="main">
  <div id="top"><button id="menuBtn" onclick="toggleSide()">☰</button><h1 id="title">总览</h1><span id="opSel" class="op-sel"></span><span class="muted" id="curMonth"></span></div>
  <div id="content"></div>
 </div>
</div>
<div id="mask"><div id="modal"><div class="mh"><span id="mTitle"></span><a onclick="closeModal()">✕</a></div><div class="mb" id="mBody"></div><div class="mf" id="mFoot"></div></div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">
<script>
"use strict";
/* ========== 基础工具 ========== */
var KEY='bss_sim_state_v1';
var S=null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function nowStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function today(){return nowStr().slice(0,10)}
function money(n){n=Math.round((+n||0)*100)/100;return '¥'+n.toFixed(2)}
function r2(n){return Math.round((+n||0)*100)/100}
function nextMonth(m){var y=+m.slice(0,4),mo=+m.slice(5,7)+1;if(mo>12){mo=1;y++}return y+'-'+pad(mo)}
function uid(p){S.seq=(S.seq||1000)+1;return p+S.seq}
function bizNo(prefix){S.noSeq=(S.noSeq||0)+1;var d=new Date();return prefix+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+String(S.noSeq).padStart(5,'0')}
var _pendingWaive=0;function flushWaiveToast(){if(_pendingWaive>0){var v=_pendingWaive;_pendingWaive=0;toast('已减免话费 '+money(v))}}
var _pendingPts=0;function flushPtsToast(){if(_pendingPts>0){var v=_pendingPts;_pendingPts=0;toast('已赠送积分 '+v)}}
function toast(t){if(_pendingWaive>0&&t&&String(t).indexOf('已减免话费')<0){t=t+'，已减免话费 '+money(_pendingWaive);_pendingWaive=0}if(_pendingPts>0&&t&&String(t).indexOf('已赠送积分')<0){t=t+'，已赠送积分 '+_pendingPts;_pendingPts=0}var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){e.style.display='none'},2400)}
// 存储层：localStorage 不可用（如 App 内预览/沙箱）时退回内存，本次打开期间照常使用
var MEMSTORE={},STORE_OK=null,STORE_NOTICED=false;
function storeOk(){if(STORE_OK!==null)return STORE_OK;try{var ls=window.localStorage,k='__bss_t';ls.setItem(k,'1');ls.removeItem(k);STORE_OK=true}catch(e){STORE_OK=false}return STORE_OK}
function sGet(k){if(storeOk()){try{return window.localStorage.getItem(k)}catch(e){STORE_OK=false}}return Object.prototype.hasOwnProperty.call(MEMSTORE,k)?MEMSTORE[k]:null}
function sSet(k,v){MEMSTORE[k]=String(v);if(storeOk()){try{window.localStorage.setItem(k,v);return true}catch(e){if(!(e&&/quota/i.test(String(e.name)+String(e.message))))STORE_OK=false;else{toast('保存失败：浏览器存储空间不足');return false}}}storeNotice();return false}
function sDel(k){delete MEMSTORE[k];if(storeOk()){try{window.localStorage.removeItem(k)}catch(e){STORE_OK=false}}}
function storeNotice(){if(STORE_NOTICED)return;STORE_NOTICED=true;setTimeout(function(){var d=document.createElement('div');d.id='storeNote';d.textContent='当前环境无法保存数据，关闭后数据会清空';d.style.cssText='position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(30,41,59,.85);color:#fff;font-size:12px;padding:6px 12px;border-radius:14px;z-index:9999;pointer-events:none;max-width:90%;text-align:center';(document.body||document.documentElement).appendChild(d);setTimeout(function(){if(d.parentNode)d.style.opacity='.55'},6000)},0)}
function save(){try{sSet(KEY,JSON.stringify(S))}catch(e){toast('保存失败：'+e.message)}}
function clearCustomers(){S.customers=[];S.tickets=[];S.bills=[];S.txns=[];S.pointLogs=[];S.campUses=[];S.custCleared1=true}
function clearPlansData(o){o=o||S;o.plans=[];o.addons=[];
 (o.customers||[]).forEach(function(c){c.planId='';c.addons=[]});
 (o.campaigns||[]).forEach(function(c){c.plans=[]});
 o.campaigns=(o.campaigns||[]).filter(function(c){return !c._planOnly});}
function clearProductsData(o){o=o||S;o.products=[];
 (o.plans||[]).forEach(function(p){p.items=[]});(o.addons||[]).forEach(function(a){a.items=[]});
 o.mall=(o.mall||[]).filter(function(m){return m.kind!=='商品'&&!m.pid});
 o.campaigns=(o.campaigns||[]).filter(function(c){return !(c.type==='赠送商品'||c.pid)});
 (o.customers||[]).forEach(function(c){c.gifts=[]});}
function clearLogsData(o){o=o||S;o.logs=[];(o.tickets||[]).forEach(function(t){if(t.undoLog&&t.status!=='已关闭'){delete t.undoLog}})}
function migratePlans1(o){
 (o.campaigns||[]).forEach(function(c){if(c.plans&&c.plans.length)c._planOnly=1});
 clearProductsData(o);clearPlansData(o);clearLogsData(o);o.plansCleared1=true}
function load(){try{var t=sGet(KEY);if(t){S=JSON.parse(t);if(S&&S.customers&&!S.custCleared1){clearCustomers();save()}if(S&&S.customers&&!S.plansCleared1){migratePlans1(S);save()}if(S&&S.customers)ensureFields(S);return !!(S&&S.customers)}}catch(e){}return false}
function clearAllPlans(){if(!cf('确认删除所有套餐？可选包也会一起删除，客户的套餐和已订可选包会清空（显示为“-”），客户本身保留。',function(){clearAllPlans()}))return;(S.campaigns||[]).forEach(function(c){if(c.plans&&c.plans.length)c._planOnly=1});clearPlansData();addLog('系统','','删除所有套餐');save();render();toast('已删除所有套餐')}
function clearAllProducts(){if(!cf('确认删除商品库中的所有商品？套餐和可选包里的商品内容、商品类兑换品、赠送商品类活动会一起清除。',function(){clearAllProducts()}))return;clearProductsData();addLog('系统','','删除所有商品');save();render();toast('已删除所有商品')}
function clearAllLogs(){if(!cf('确认清空所有受理记录？清空后之前的业务将无法再撤单。',function(){clearAllLogs()}))return;clearLogsData();save();render();toast('已清空受理记录')}
// 清除已销户客户：永久删除客户及所有引用该客户的数据（不可撤单）
function purgeClosedData(){var ids={};S.customers.forEach(function(c){if(c.status==='销户')ids[c.id]=1});var n=Object.keys(ids).length;if(!n)return 0;
 S.customers=S.customers.filter(function(c){return !ids[c.id]});
 Object.keys(S).forEach(function(k){var v=S[k];if(!Array.isArray(v)||k==='customers')return;if(!v.some(function(x){return x&&typeof x==='object'&&('cid' in x)}))return;S[k]=v.filter(function(x){return !(x&&typeof x==='object'&&ids[x.cid])})});
 if(Array.isArray(S.logs)){var gone={};S.logs.forEach(function(l){if(l.undo&&ids[l.undo.cid])gone[l.no]=1});S.logs=S.logs.filter(function(l){return !(gone[l.no]||(l.undo&&ids[l.undo.cid]))})}
 if(sub.cdC&&ids[sub.cdC])sub.cdC='';return n}
function purgeClosed(){var n=S.customers.filter(function(c){return c.status==='销户'}).length;if(!n)return toast('没有已销户客户');
 if(!cf('将永久删除 '+n+' 个已销户客户及其全部相关数据（受理记录、账单、交易、工单、积分、活动参与、话费减免等），不可撤销。确认删除？',function(){purgeClosed()}))return;
 var k=purgeClosedData();addLog('系统','','清除已销户客户 '+k+' 个（含相关数据，不可撤单）');save();render();toast('已删除 '+k+' 个已销户客户')}
function clearAllCustomers(){if(!cf('确认删除所有客户？相关工单、账单、资金流水和积分流水也会一起删除，套餐、商品、活动等设置保留。',function(){clearAllCustomers()}))return;clearCustomers();addLog('系统','','清空所有客户');save();render();toast('已删除所有客户')}
function byId(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}
function num(v,d){v=parseFloat(v);return isNaN(v)?(d||0):v}

/* ========== 示例数据 ========== */
function seed(){
 var m=today().slice(0,7),y=today().slice(0,4);
 S={version:1,seq:1000,noSeq:0,month:m,
  products:[],
  plans:[],
  addons:[],
  campaigns:[
   {id:'C1',name:'充100送20',type:'充值赠送',plans:[],start:y+'-01-01',end:y+'-12-31',threshold:100,value:20,pid:'',status:'启用',uses:0,total:0},
   {id:'C3',name:'年末积分双倍',type:'积分翻倍',plans:[],start:y+'-11-01',end:y+'-12-31',threshold:0,value:2,pid:'',status:'启用',uses:0,total:0}
  ],
  pointRules:{perYuan:1,rechargePer100:10,tenurePerMonth:5,reviewCust:5},
  agentRules:{assign:1,close:5,good:10,bad:-5,transfer:0},
  mall:[
   {id:'M1',name:'10元话费',kind:'话费',value:10,pid:'',qty:1,cost:1000,stock:999,on:true}
  ],
  agents:[
   {id:'G1',name:'客服·小林（示例）',group:'一线客服',status:'在岗',points:0},
   {id:'G2',name:'客服·小周（示例）',group:'一线客服',status:'在岗',points:0},
   {id:'G3',name:'客服·老陈（示例）',group:'二线支撑',status:'在岗',points:0}
  ],
  customers:[],bills:[],txns:[],logs:[],pointLogs:[],agentLogs:[],tickets:[],campUses:[],monthRevenue:{},custCleared1:true,plansCleared1:true
 };
 var hm=m,hist=[1580,1622,1655,1610,1702];for(var k=0;k<5;k++){var yy=+hm.slice(0,4),mm=+hm.slice(5,7)-1;if(mm<1){mm=12;yy--}hm=yy+'-'+pad(mm);S.monthRevenue[hm]=hist[4-k]}
 opDefaults(S);levelDefaults(S);addLog('系统','','初始化数据（套餐、商品为空，请在「商品库」「套餐管理」自行设置）');
}

/* ========== 记录 ========== */
function addLog(type,cid,desc){var oi=opInfo();S.logs.unshift({no:bizNo('SL'),t:nowStr(),type:type,cid:cid||'',desc:desc,op:oi.op,opNo:oi.opNo||'',opId:oi.opId||'',dept:oi.dept});if(S.logs.length>3000)S.logs.length=3000}
// 停机（含欠费停机）客户不能办理业务，只能充值/缴费、复机、销户
var STOP_MSG='客户处于停机状态，不能办理业务（仅可充值/复机）';
function isStopped(c){return !!c&&String(c.status||'').indexOf('停机')>=0}
function assertNotStopped(c){if(isStopped(c))throw new Error(STOP_MSG)}
// 信用额度：有效期留空=长期有效；可用额度=余额+有效信用额度；欠费不超过信用额度时仍为在网
function creditOf(c){if(!c)return 0;var v=num(c.credit);if(!(v>0))return 0;if(c.creditExp&&today()>c.creditExp)return 0;return v}
function availBal(c){return r2(num(c.balance)+creditOf(c))}
function overCredit(c){return num(c.balance)< -creditOf(c)-1e-9}
function creditText(c){var v=num(c.credit);if(!(v>0))return '未设置';return money(v)+'（'+(c.creditExp?'有效期至 '+c.creditExp+(today()>c.creditExp?'，已过期':''):'长期有效')+'）'}
function setCredit(cid,amount,exp){return withUndo('信用额度',cid,function(){var c=byId(S.customers,cid);if(!c)throw new Error('请选择客户');if(c.status==='销户')throw new Error('已销户客户不能设置信用额度');
 var v=r2(num(amount));if(!(v>=0))throw new Error('信用额度不能为负');if(exp&&!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(exp))throw new Error('有效期格式应为 YYYY-MM-DD');
 var old=creditText(c);c.credit=v;c.creditExp=exp||'';addLog('信用额度',c.id,'信用额度：'+old+' → '+creditText(c)+'，可用额度 '+money(availBal(c)));
 if(c.status==='欠费停机'&&!overCredit(c)){c.status='在网';addLog('复机',c.id,'调整信用额度后欠费在额度内，自动复机')}
 else if(c.status==='在网'&&overCredit(c)){c.status='欠费停机';addLog('停机',c.id,'调整信用额度后欠费超出额度，欠费停机')}
 save();return c})}
// 信用额度到期检查：过期后欠费超出额度的在网客户转欠费停机

// 参加营销活动：按活动类型直接参加，或打开对应业务并预先勾选该活动
var JOIN_WAY={'积分翻倍':'join','充值赠送':'充值','充值分月返还':'充值','满减':'direct','折扣':'direct','赠送商品':'direct','专项减免':'direct'};
function joinWay(x,c){var w=JOIN_WAY[x.type];if(!w)return null;if(w==='direct'){var g=directGrant(x,c);if(g.err)return {w:w,dis:g.err}}return {w:w}}
// 办理（满减/折扣/赠送商品）：不需要绑定其它业务，门槛不适用
function directGrant(x,c){var v=num(x.value);
 if(x.type==='赠送商品'){var p=byId(S.products,x.pid);if(!p)return {err:'活动未设置赠送商品'};var q=v||1;return {kind:'gift',pid:p.id,qty:q,hit:r2(num(p.price)*q),text:'赠送 '+p.name+(q>1?' ×'+q+'份':'')+'（本账期有效，价值 '+money(r2(num(p.price)*q))+'）'}}
 if(x.type==='满减'){if(!(v>0))return {err:'活动减免金额未设置'};return {kind:'credit',hit:r2(v),text:'话费减免 '+money(v)+'，计入账户余额'}}
 if(x.type==='折扣'){if(!(v>0&&v<10))return {err:'折扣值应在 0–10 之间'};var pl=c?byId(S.plans,c.planId):null;if(!pl||!(num(pl.fee)>0))return {err:'客户套餐无月租，无法按折扣减免'};var h=r2(num(pl.fee)*(1-v/10));return {kind:'credit',hit:h,text:'按套餐月租 '+money(pl.fee)+' 打 '+v+' 折，话费减免 '+money(h)+'，计入账户余额'}}
 if(x.type==='专项减免'){var t=byId(S.addons,x.targetAid);if(!t)return {err:'活动未设置减免的可选包'};if(!c||(!adHasActive(c,t.id)&&!hasPendingAddon(c,t.id)))return {err:'需先订购「'+t.name+'」'};if(spCampHas(c,x))return {err:'已办理该专项减免'};return {kind:'special',hit:0,text:campRule(x)+'：只抵扣该包产生的费用，单月不超过该包实际费用'}}
 return {err:'该类型不能办理'}}
function directJoinCamp(cid,id){return withUndo('参加活动',cid,function(){var c=byId(S.customers,cid),x=byId(S.campaigns,id);if(!c||!x)throw new Error('参数错误');assertNotStopped(c);
 if(c.status==='销户')throw new Error('已销户客户不可参加活动');if(!campActive(x,c.planId,c))throw new Error('该客户不符合活动条件，或已达到参加次数上限');
 var g=directGrant(x,c);if(g.err)throw new Error(g.err);
 if(g.kind==='special'){var rr=addSpWaive(c,{targetAid:x.targetAid,full:!(num(x.value)>0),amt:x.value,months:x.months,campId:x.id,src:'营销活动',srcName:x.name,name:x.name},null,'参加活动 '+x.name);g.hit=rr.d;g.text=campRule(x)+(rr.d>0?'，本月已抵扣 '+money(rr.d):'，从下次出账起抵扣')+'，'+(rr.w.end?'有效至 '+monthEndDate(rr.w.end):'长期有效')}
 else if(g.kind==='gift'){c.gifts=(c.gifts||[]).concat([{pid:g.pid,qty:g.qty,month:S.month,from:x.name,src:'营销活动'}]);addTxn(c.id,'活动优惠',g.hit,x.name+' · 办理')}
 else if(g.kind==='credit'){c.balance=r2(c.balance+g.hit);addTxn(c.id,'话费减免',g.hit,'营销活动减免：'+x.name)}
 x.uses=(x.uses||0)+1;x.total=r2((x.total||0)+g.hit);
 recCampUse(c,x,'订购',g.hit,g.text);
 if(g.kind!=='special')addLog('营销活动',c.id,'办理活动：'+x.name+'，'+g.text+'，余额 '+money(c.balance));
 if(c.status==='欠费停机'&&!overCredit(c)){c.status='在网';addLog('复机',c.id,'活动减免后欠费在信用额度内，自动复机')}
 save();return g})}

 '<div class="f full"><label>已参加的活动</label>'+(function(){var us=campUsesOf(c.id).filter(function(u){return u.scene!=='手动参加'});var h=us.map(function(u){return '<div class="items-row"><span style="flex:1">'+esc(u.campName||'')+' <span class="muted" style="font-size:12px">（'+esc(u.scene||'')+' · '+esc(u.t||'')+(u.desc?' · '+esc(u.desc):'')+'）</span></span>'+campUseStatusHtml(u,c)+'</div>'}).join('');return h})()+(en.length?en.map(function(x){return '<div class="items-row"><span style="flex:1">'+esc(x.name)+' <span class="muted">（'+esc(campRule(x))+'）</span></span><button class="btn s d" onclick="try{quitCamp(\''+c.id+'\',\''+x.id+'\');toast(\'已退出活动\');render();dlgJoinCamp(\''+c.id+'\')}catch(e){toast(e.message)}">退出</button></div>'}).join(''):(campUsesOf(c.id).filter(function(u){return u.scene!=='手动参加'}).length?'':'<span class="muted">无</span>'))+'</div>'+

 var f=sub.tSt||'';var ts=S.tickets.filter(function(t){return !f||t.status===f});
 return '<div class="card"><div class="toolbar"><button class="btn p" onclick="dlgTicket()">＋ 新建工单</button><select onchange="sub.tSt=this.value;render()"><option value="">全部状态</option>'+sopts(['待指派','处理中','已关闭'],f)+'</select><span class="muted">共 '+ts.length+' 张</span></div><div class="tbl-wrap"><table><tr><th>工单号</th><th>创建时间</th><th>客户</th><th>分类</th><th>标题</th><th>处理客服</th><th>状态</th><th>评价</th><th>操作</th></tr>'+(ts.map(function(t){var a=byId(S.agents,t.agentId);
  return '<tr><td class="mono"><a onclick="dlgTicketView(\''+t.id+'\')">'+t.no+'</a></td><td>'+t.t+'</td><td>'+esc(custName(t.cid))+'</td><td>'+esc(t.cat)+'</td><td>'+esc(t.title)+(t.undoLog?'<div class="muted mono" style="font-size:11px">撤 '+esc(t.undoLog)+'</div>':'')+'</td><td>'+esc(a?a.name:'-')+'</td><td>'+statusBadge(t.status)+'</td><td>'+(t.rating?'★'.repeat(t.rating):'-')+'</td><td>'+(t.status==='已关闭'?'<button class="btn s" onclick="dlgTicketView(\''+t.id+'\')">查看</button>':(t.undoLog?'<button class="btn s p" onclick="approveUndo(\''+t.id+'\')">同意撤单</button>':'')+'<button class="btn s" onclick="dlgAssign(\''+t.id+'\')">'+(t.agentId?'流转':'指派')+'</button><button class="btn s" onclick="dlgClose(\''+t.id+'\')">关闭</button>')+'</td></tr>'}).join('')||'<tr><td colspan=9 class="muted">暂无工单</td></tr>')+'</table></div></div>';
};
function dlgTicket(cid){openModal('新建工单','<div class="form"><div class="f full"><label>客户</label><select id="t_c" onchange="ticketUndoOpts()">'+opts(S.customers,cid||'',custLabel)+'</select></div><div class="f"><label>分类</label><select id="t_cat" onchange="ticketUndoOpts()">'+sopts(TCATS)+'</select></div><div class="f full" id="t_undo_box" style="display:none"><label>要撤销的受理记录</label><select id="t_undo"></select></div><div class="f"><label>标题 *</label><input id="t_title" placeholder="如：网速慢"></div><div class="f full"><label>描述</label><textarea id="t_desc" rows="3"></textarea></div></div>',function(){if(fv('t_cat')==='撤单申请'&&!fv('t_undo'))throw new Error('请选择要撤销的受理记录');var tk=createTicket(fv('t_c'),fv('t_title')||(fv('t_cat')==='撤单申请'?'撤单申请':''),fv('t_cat'),fv('t_desc'));if(fv('t_cat')==='撤单申请'){tk.undoLog=fv('t_undo');tk.flow.push({t:nowStr(),op:opName(),dept:opDept(),text:'申请撤销受理记录 '+tk.undoLog});save()}toast('工单已创建');page='ticket'})}
function dlgAssign(tid){var t=byId(S.tickets,tid);openModal((t.agentId?'流转':'指派')+'工单 '+t.no,'<div class="form"><div class="f full"><label>处理客服</label><select id="a_g">'+opts(S.agents.filter(function(a){return a.status==='在岗'&&a.id!==t.agentId}),'',function(a){return a.name+'（'+a.group+'，'+a.points+'分）'})+'</select></div><div class="f full"><label>备注</label><input id="a_n"></div></div>',function(){assignTicket(tid,fv('a_g'),fv('a_n'));toast('已'+(t.agentId?'流转':'指派'))})}
function dlgClose(tid){var t=byId(S.tickets,tid);openModal('关闭工单 '+t.no,'<div class="form"><div class="f"><label>客户评价</label><select id="c_r"><option value="5">★★★★★ 非常满意</option><option value="4">★★★★ 满意</option><option value="3">★★★ 一般</option><option value="2">★★ 不满意</option><option value="1">★ 很不满意</option><option value="0">未评价</option></select></div><div class="f"><label>处理结果</label><input id="c_n" value="已解决"></div><div class="f full note">结单客服 +'+S.agentRules.close+' 分；4–5星好评 +'+S.agentRules.good+' 分；1–2星差评 '+S.agentRules.bad+' 分；客户评价奖励 '+S.pointRules.reviewCust+' 积分（可在「客服与绩效」「客户积分」中修改规则）。</div></div>',function(){closeTicket(tid,fv('c_r'),fv('c_n'));toast('工单已关闭')})}
function dlgTicketView(tid){var t=byId(S.tickets,tid),a=byId(S.agents,t.agentId);openModal('工单 '+t.no,'<div class="kv"><div>客户</div><div>'+esc(custName(t.cid))+'</div><div>分类</div><div>'+esc(t.cat)+'</div><div>标题</div><div>'+esc(t.title)+'</div><div>客服</div><div>'+esc(a?a.name:'-')+'</div><div>状态</div><div>'+statusBadge(t.status)+'</div><div>评价</div><div>'+(t.rating?'★'.repeat(t.rating):'-')+'</div></div><h4>流转记录</h4>'+t.flow.map(function(f){return '<div style="margin:6px 0"><span class="muted">'+f.t+(f.op?' · '+esc(f.op)+(f.dept&&f.dept!=='-'?'（'+esc(f.dept)+'）':''):'')+'</span> '+esc(f.text)+'</div>'}).join(''),null)}

PAGES.log=function(){var q=sub.logQ||'',ty=sub.logT||'';var types={};S.logs.forEach(function(l){types[l.type]=1});
 var ls=S.logs.filter(function(l){return (!ty||l.type===ty)&&(!q||(l.no+l.desc+custName(l.cid)).indexOf(q)>=0)}).slice(0,300);

var PTYPES=['流量','语音','短信','权益','宽带','话费减免','赠送积分','其他'];
function refCount(pid){return S.plans.filter(function(pl){return pl.items.some(function(i){return i.pid===pid})}).length+S.addons.filter(function(a){return a.items.some(function(i){return i.pid===pid})}).length}
PAGES.prod=function(){return '<div class="card"><div class="toolbar"><button class="btn p" onclick="dlgProd()">＋ 新增商品</button><span class="muted">类型为“流量/语音/短信”的商品会计入客户额度并参与超额计算；“话费减免”商品订购后立即减免，有效期内每月出账再减免；其它类型作为权益展示</span></div><div class="tbl-wrap"><table><tr><th>编号</th><th>名称</th><th>类型</th><th>每份规格</th><th class="right">单价/价值</th><th>说明</th><th>状态</th><th>被引用</th><th>操作</th></tr>'+(S.products.map(function(p){
 return '<tr><td class="mono">'+p.id+'</td><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.type)+'</td><td>'+specText(p)+'</td><td class="right">'+money(p.price)+'</td><td>'+esc(p.desc)+'</td><td>'+(p.on?'<span class="badge b-ok">上架</span>':'<span class="badge">下架</span>')+'</td><td>'+refCount(p.id)+'</td><td><button class="btn s" onclick="dlgProd(\''+p.id+'\')">编辑</button><button class="btn s" onclick="toggleProd(\''+p.id+'\')">'+(p.on?'下架':'上架')+'</button><button class="btn s d" onclick="delItem(\'products\',\''+p.id+'\')">删除</button></td></tr>'}).join('')||'<tr><td colspan=9 class="muted">暂无商品，点击「＋ 新增商品」添加</td></tr>')+'</table></div></div>'};
function dlgProd(id){var p=id?byId(S.products,id):{name:'',type:'流量',unit:'GB',qty:'',price:0,desc:'',on:true};
 openModal(id?'编辑商品':'新增商品','<div class="form"><div class="f"><label>名称 *</label><input id="pr_n" value="'+esc(p.name)+'"></div><div class="f"><label>类型</label><select id="pr_t">'+sopts(PTYPES,p.type)+'</select></div><div class="f"><label>单位</label><input id="pr_u" value="'+esc(p.unit)+'" placeholder="GB/分钟/条/张/月"></div><div class="f"><label>每份数量（选填）</label><input id="pr_q" type="number" placeholder="可不填" value="'+(p.qty===''||p.qty==null?'':p.qty)+'"></div><div class="f"><label>单价/价值（元/份）</label><input id="pr_p" type="number" value="'+p.price+'"></div><div class="f"><label>状态</label><select id="pr_o"><option value="1"'+(p.on?' selected':'')+'>上架</option><option value="0"'+(!p.on?' selected':'')+'>下架</option></select></div><div class="f"><label>减免金额（元/月，话费减免类填写）</label><input id="pr_w" type="number" value="'+(p.waiveAmt==null?'':p.waiveAmt)+'"></div><div class="f"><label>每月赠送积分（赠送积分类填写）</label><input id="pr_pt" type="number" value="'+(p.ptsMonthly==null?'':p.ptsMonthly)+'"></div><div class="f"><label>有效月数（话费减免/赠送积分类，留空为长期）</label><input id="pr_v" type="number" placeholder="留空为长期" value="'+(p.validMonths===''||p.validMonths==null?'':p.validMonths)+'"></div><div class="f full"><label>说明</label><input id="pr_d" value="'+esc(p.desc)+'"></div></div>',function(){
  if(!fv('pr_n'))throw new Error('请填写名称');var o={name:fv('pr_n'),type:fv('pr_t'),unit:fv('pr_u'),qty:(fv('pr_q')===''?'':num(fv('pr_q'),1)),price:num(fv('pr_p')),desc:fv('pr_d'),on:fv('pr_o')==='1'};if(o.type==='话费减免'){o.waiveAmt=num(fv('pr_w'));o.validMonths=fv('pr_v')===''?'':Math.max(0,Math.round(num(fv('pr_v'))))||'';if(!(o.waiveAmt>0))throw new Error('请填写减免金额')}if(o.type==='赠送积分'){o.ptsMonthly=Math.round(num(fv('pr_pt')));o.validMonths=fv('pr_v')===''?'':Math.max(0,Math.round(num(fv('pr_v'))))||'';if(!(o.ptsMonthly>0))throw new Error('请填写每月赠送积分')}
  if(id){Object.assign(p,o);addLog('配置','','修改商品 '+o.name)}else{o.id=uid('P');S.products.push(o);addLog('配置','','新增商品 '+o.name)}save();toast('已保存')})}
function toggleProd(id){var p=byId(S.products,id);p.on=!p.on;addLog('配置','',(p.on?'上架':'下架')+'商品 '+p.name);save();render()}
function delItem(coll,id,force){var it=byId(S[coll],id);if(!it)return false;
 if(coll==='products'&&refCount(id)){toast('该商品被套餐/可选包引用，请先移除引用或改为下架');return false}
 if(coll==='plans'&&S.customers.some(function(c){return c.planId===id&&c.status!=='销户'})){toast('仍有客户使用该套餐，请改为下架');return false}
 if(coll==='addons'&&S.customers.some(function(c){return adHasActive(c,id)})){toast('仍有客户订购该可选包，请改为下架');return false}
 if(coll==='agents'&&S.tickets.some(function(t){return t.agentId===id&&t.status!=='已关闭'})){toast('该客服有未结工单，请先流转');return false}
 if(!force&&!cf('确认删除「'+it.name+'」？',function(){delItem(coll,id,true)}))return false;S[coll]=S[coll].filter(function(x){return x.id!==id});if(coll==='plans')S.addons.forEach(function(a){if(Array.isArray(a.applicablePlans))a.applicablePlans=a.applicablePlans.filter(function(x){return x!==id})});addLog('配置','','删除 '+it.name);save();render();return true}

/* ---- 套餐 / 可选包 组成编辑 ---- */
function itemsEditor(items){return '<div id="itemsBox">'+(items.length?items:[{pid:'',qty:1}]).map(itemRow).join('')+'</div><div><button class="btn s" type="button" onclick="addItemRow()">＋ 添加商品</button> <span class="muted" style="font-size:12px">数量=份数，实际额度=份数×商品每份规格</span></div>'}
function itemRow(it){return '<div class="items-row"><select class="ir_p">'+opts(S.products.filter(function(p){return p.on||p.id===it.pid}),it.pid,function(p){return p.name+'（'+p.type+(specText(p)==='-'?'':'，每份'+specText(p))+'）'},'选择商品')+'</select><input class="ir_q" type="number" value="'+(it.qty||1)+'" title="份数"><span class="muted">份</span><button class="btn s d" type="button" onclick="this.parentNode.remove()">✕</button></div>'}
function addItemRow(){$('itemsBox').insertAdjacentHTML('beforeend',itemRow({pid:'',qty:1}))}
function readItems(){var out=[];document.querySelectorAll('#itemsBox .items-row').forEach(function(r){var p=r.querySelector('.ir_p').value,q=num(r.querySelector('.ir_q').value);if(p&&q>0)out.push({pid:p,qty:q})});return out}
function itemsValue(items){return r2(items.reduce(function(s,it){var p=byId(S.products,it.pid);return s+(p?p.price*it.qty:0)},0))}

 return '<tr><td><b>'+esc(p.name)+'</b></td><td class="right">'+money(p.fee)+'</td><td>'+validityText(p)+'</td><td style="white-space:normal;min-width:220px">'+esc(itemsText(p.items))+'</td><td class="right">'+money(itemsValue(p.items))+'</td><td style="font-size:12px">流量 '+money(p.over.data)+'/GB<br>通话 '+money(p.over.voice)+'/分<br>短信 '+money(p.over.sms)+'/条</td><td>'+n+'</td><td>'+statusBadge(p.status)+'</td><td><button class="btn s" onclick="viewPlan(\''+p.id+'\')">详情</button><button class="btn s" onclick="dlgPlan(\''+p.id+'\')">编辑</button><button class="btn s" onclick="dlgPlan(\''+p.id+'\',1)">复制</button><button class="btn s d" onclick="delItem(\'plans\',\''+p.id+'\')">删除</button></td></tr>'}).join('')||'<tr><td colspan=9 class="muted">暂无套餐，点击「＋ 新增套餐」添加</td></tr>')+'</table></div></div>'};

 openModal(id&&!copy?'编辑套餐':'新增套餐','<div class="form"><div class="f"><label>套餐名称 *</label><input id="pl_n" value="'+esc(p.name)+'"></div><div class="f"><label>月租（元）</label><input id="pl_f" type="number" value="'+p.fee+'"></div><div class="f"><label>合约期/有效期（月）（选填）</label><input id="pl_v" type="number" placeholder="可不填" value="'+esc(p.validity==null?'':p.validity)+'"></div><div class="f"><label>状态</label><select id="pl_s">'+sopts(['在售','下架'],p.status)+'</select></div><div class="f full"><label>套餐内容（从商品库选择）</label>'+itemsEditor(p.items)+'</div><div class="f"><label>超额流量（元/GB）</label><input id="pl_od" type="number" value="'+p.over.data+'"></div><div class="f"><label>超额通话（元/分钟）</label><input id="pl_ov" type="number" value="'+p.over.voice+'"></div><div class="f"><label>超额短信（元/条）</label><input id="pl_os" type="number" value="'+p.over.sms+'"></div></div>',function(){
  if(!fv('pl_n'))throw new Error('请填写套餐名称');var o={name:fv('pl_n'),fee:num(fv('pl_f')),validity:(fv('pl_v')===''?'':num(fv('pl_v'))),status:fv('pl_s'),items:readItems(),over:{data:num(fv('pl_od')),voice:num(fv('pl_ov')),sms:num(fv('pl_os'))}};

 addLog('配置','','删除客户级别 '+l.name+(cs.length?'，'+cs.length+' 位客户调整为 '+def.name:''));save();render();toast('已删除')}
function dlgCredit(cid){var c=byId(S.customers,cid);if(!c)return;
 openModal('设置信用额度 · '+c.name,'<div class="form"><div class="f"><label>信用额度（元，0=不设）</label><input id="cr_v" type="number" min="0" value="'+(num(c.credit)||0)+'"></div><div class="f"><label>有效期至（留空=长期有效）</label><input id="cr_x" type="date" value="'+esc(c.creditExp||'')+'"></div><div class="f full note">当前余额 '+money(c.balance)+'，状态 '+esc(c.status)+'。欠费在信用额度内时客户保持在网，可正常办理业务；超出额度或额度过期后欠费，转为欠费停机。欠费停机客户调高额度后欠费回到额度内，会自动复机。</div></div>',function(){var r=setCredit(cid,fv('cr_v'),fv('cr_x'));toast('信用额度已设置，可用额度 '+money(availBal(r)))},'确认')}
function dlgChangeLevel(cid){var c=byId(S.customers,cid);if(!c)return;if(isStopped(c))return toast(STOP_MSG);var cur=levelOf(c);
 openModal('调整级别 · '+c.name,'<div class="form"><div class="f full"><label>当前级别</label><div>'+levelBadge(c)+'</div></div><div class="f"><label>调整为</label><select id="cl_l">'+levelsSorted().filter(function(l){return l!==cur}).map(function(l){return '<option value="'+esc(l.id)+'">'+esc(l.name)+'（等级 '+esc(String(l.rank))+'）</option>'}).join('')+'</select></div><div class="f"><label>原因（选填）</label><input id="cl_r" placeholder="如：客户申请/营销赠送"></div></div>',function(){var d=changeLevel(cid,fv('cl_l'),fv('cl_r'));toast('已'+d+'为 '+levelName(c))},'确认调整')}
function curOp(){if(!S||!Array.isArray(S.operators))return null;var id='';try{id=sGet(OPKEY)||''}catch(e){}
 var o=byId(S.operators,id);if(o&&o.status==='启用')return o;o=S.operators.filter(function(x){return x.status==='启用'})[0]||null;if(o){try{sSet(OPKEY,o.id)}catch(e){}}return o}
function deptName(id){var d=S&&S.depts?byId(S.depts,id):null;return d?d.name:'-'}
function opName(){var o=curOp();return o?o.name:'-'}
function opDept(){var o=curOp();return o?deptName(o.deptId):'-'}
function opInfo(){var o=curOp();return o?{op:o.name,opNo:o.no,opId:o.id,dept:deptName(o.deptId)}:{op:'-',dept:'-'}}
function setCurOp(id){var o=byId(S.operators,id);if(!o||o.status!=='启用')return toast('该操作员不可用');try{sSet(OPKEY,id)}catch(e){}toast('当前操作员：'+o.name+'（'+deptName(o.deptId)+'）');render()}
function renderOpSel(){var el=$('opSel');if(!el||!S)return;var cur=curOp();
 el.innerHTML='<span class="muted op-l">当前操作员</span><select onchange="setCurOp(this.value)" style="max-width:200px;padding:4px 6px">'+S.operators.filter(function(o){return o.status==='启用'}).map(function(o){return '<option value="'+esc(o.id)+'"'+(cur&&cur.id===o.id?' selected':'')+'>'+esc(o.name+'（'+deptName(o.deptId)+'）')+'</option>'}).join('')+'</select>'}
function enabledOps(){return S.operators.filter(function(o){return o.status==='启用'})}
PAGES.operator=function(){var cur=curOp();
 var h='<div class="card"><h3>部门管理<span class="sp"></span><button class="btn p" onclick="dlgDept()">＋ 新增部门</button></h3><div class="tbl-wrap"><table><tr><th>部门编号</th><th>部门名称</th><th>说明</th><th class="right">操作员数</th><th>操作</th></tr>'+(S.depts.map(function(d){var n=S.operators.filter(function(o){return o.deptId===d.id}).length;
  return '<tr><td class="mono">'+esc(d.id)+'</td><td><b>'+esc(d.name)+'</b></td><td>'+esc(d.desc||'')+'</td><td class="right">'+n+'</td><td><button class="btn s" onclick="dlgDept(\''+d.id+'\')">编辑</button><button class="btn s d" onclick="delDept(\''+d.id+'\')">删除</button></td></tr>'}).join('')||'<tr><td colspan=5 class="muted">暂无部门</td></tr>')+'</table></div></div>';
 h+='<div class="card"><h3>操作员管理<span class="sp"></span><button class="btn p" onclick="dlgOperator()">＋ 新增操作员</button></h3><div class="note" style="margin-bottom:10px">当前操作员：<b>'+esc(cur?cur.name+'（'+cur.no+'，'+deptName(cur.deptId)+'）':'-')+'</b>。新的受理记录、撤单和工单流转都会记下办理的操作员和部门。至少要保留一个启用的操作员；系统不保存密码。</div><div class="tbl-wrap"><table><tr><th>工号</th><th>姓名</th><th>部门</th><th>岗位/角色</th><th>手机号</th><th>权限</th><th>状态</th><th>创建时间</th><th>操作</th></tr>'+S.operators.map(function(o){
  return '<tr><td class="mono">'+esc(o.no)+'</td><td><b>'+esc(o.name)+'</b>'+(cur&&cur.id===o.id?' <span class="badge b-pri">当前</span>':'')+'</td><td>'+esc(deptName(o.deptId))+'</td><td>'+esc(o.role)+'</td><td class="mono">'+esc(o.phone||'')+'</td><td>'+((o.crossUndo?'<span class="badge b-pri">跨单撤单</span> ':'')+(o.undoOpen?'<span class="badge b-pri">撤销开户</span>':'')||'<span class="muted">-</span>')+'</td><td>'+(o.status==='启用'?'<span class="badge b-ok">启用</span>':'<span class="badge">停用</span>')+'</td><td>'+esc(o.created||'-')+'</td><td>'+(o.status==='启用'&&!(cur&&cur.id===o.id)?'<button class="btn s" onclick="setCurOp(\''+o.id+'\')">切换为当前</button>':'')+'<button class="btn s" onclick="dlgOperator(\''+o.id+'\')">编辑</button><button class="btn s" onclick="toggleOperator(\''+o.id+'\')">'+(o.status==='启用'?'停用':'启用')+'</button><button class="btn s d" onclick="delOperator(\''+o.id+'\')">删除</button></td></tr>'}).join('')+'</table></div></div>';
 return h};
function dlgDept(id){var d=id?byId(S.depts,id):{name:'',desc:''};
 openModal(id?'编辑部门':'新增部门','<div class="form"><div class="f"><label>部门名称 *</label><input id="dp_n" value="'+esc(d.name)+'"></div><div class="f"><label>说明（选填）</label><input id="dp_d" value="'+esc(d.desc||'')+'"></div></div>',function(){var n=fv('dp_n');if(!n)throw new Error('请填写部门名称');
  if(S.depts.some(function(x){return x.name===n&&x.id!==id}))throw new Error('部门名称已存在');
  if(id){d.name=n;d.desc=fv('dp_d');addLog('配置','','修改部门 '+n)}else{S.depts.push({id:uid('D'),name:n,desc:fv('dp_d')});addLog('配置','','新增部门 '+n)}save();renderOpSel();toast('已保存')})}
function delDept(id){var d=byId(S.depts,id);if(!d)return;var n=S.operators.filter(function(o){return o.deptId===id}).length;
 if(n){toast('部门「'+d.name+'」下还有 '+n+' 名操作员，不能删除，请先调整或删除这些操作员');return false}
 if(!cf('确认删除部门「'+d.name+'」？',function(){delDept(id)}))return false;S.depts=S.depts.filter(function(x){return x.id!==id});addLog('配置','','删除部门 '+d.name);save();render();toast('已删除');return true}
function nextOpNo(){var n=(S.opSeq||0)+1,no;do{no='OP'+String(n).padStart(4,'0');n++}while(S.operators.some(function(o){return o.no===no}));return no}
function dlgOperator(id){var o=id?byId(S.operators,id):{no:nextOpNo(),name:'',deptId:(S.depts[0]||{}).id||'',role:'营业员',phone:'',status:'启用'};
 if(!S.depts.length)return toast('请先新增部门');
 openModal(id?'编辑操作员':'新增操作员','<div class="form"><div class="f"><label>工号 *（自动生成，可修改）</label><input id="op_no" value="'+esc(o.no)+'"></div><div class="f"><label>姓名 *</label><input id="op_n" value="'+esc(o.name)+'"></div><div class="f"><label>部门 *</label><select id="op_d">'+opts(S.depts,o.deptId)+'</select></div><div class="f"><label>岗位/角色</label><select id="op_r">'+sopts(OP_ROLES.indexOf(o.role)>=0?OP_ROLES:OP_ROLES.concat([o.role]),o.role)+'</select></div><div class="f"><label>手机号（选填）</label><input id="op_p" value="'+esc(o.phone||'')+'"></div><div class="f"><label>状态</label><select id="op_s">'+sopts(['启用','停用'],o.status)+'</select></div><div class="f full"><label style="display:flex;gap:6px;align-items:center;font-size:13px;color:inherit;cursor:pointer"><input type="checkbox" id="op_cu" style="width:auto;margin:0"'+(o.crossUndo?' checked':'')+'> 跨单撤单权限（可不按时间倒序，直接撤销客户较早的业务）</label></div><div class="f full"><label style="display:flex;gap:6px;align-items:center;font-size:13px;color:inherit;cursor:pointer"><input type="checkbox" id="op_uo" style="width:auto;margin:0"'+(o.undoOpen?' checked':'')+'> 撤销开户权限（客户开户后办过其它业务，也可直接撤销开户，连带撤销其后全部业务）</label></div></div>',function(){
  var v={no:fv('op_no'),name:fv('op_n'),deptId:fv('op_d'),role:fv('op_r'),phone:fv('op_p'),status:fv('op_s'),crossUndo:!!($('op_cu')&&$('op_cu').checked),undoOpen:!!($('op_uo')&&$('op_uo').checked)};
  if(!v.no)throw new Error('请填写工号');if(!v.name)throw new Error('请填写姓名');if(!byId(S.depts,v.deptId))throw new Error('请选择部门');
  if(S.operators.some(function(x){return x.no===v.no&&x.id!==id}))throw new Error('工号已存在');
  if(id&&o.status==='启用'&&v.status==='停用'&&enabledOps().length<=1)throw new Error('至少要保留一个启用的操作员');
  if(id){Object.assign(o,v);addLog('配置','','修改操作员 '+v.no+' '+v.name)}else{v.id=uid('O');v.created=nowStr();S.opSeq=(S.opSeq||0)+1;S.operators.push(v);addLog('配置','','新增操作员 '+v.no+' '+v.name+'（'+deptName(v.deptId)+'）')}
  save();renderOpSel();toast('已保存')})}
function toggleOperator(id){var o=byId(S.operators,id);if(!o)return;if(o.status==='启用'&&enabledOps().length<=1){toast('至少要保留一个启用的操作员');return}
 o.status=o.status==='启用'?'停用':'启用';addLog('配置','',o.status+'操作员 '+o.no+' '+o.name);save();render()}
function delOperator(id){var o=byId(S.operators,id);if(!o)return false;if(o.status==='启用'&&enabledOps().length<=1){toast('至少要保留一个启用的操作员，不能删除');return false}
 if(!cf('确认删除操作员「'+o.name+'」？历史受理记录中的姓名会保留。',function(){delOperator(id)}))return false;S.operators=S.operators.filter(function(x){return x.id!==id});addLog('配置','','删除操作员 '+o.no+' '+o.name);save();render();return true}

/* ========== 启动 ========== */
if(!load()){seed();ensureFields(S);save()}else{ensureFields(S);save();checkCredit('信用额度到期检查');applyPendingPlans('到期自动生效',today());applyPendingAddons('跨月自动生效')}
var _ir0=processInstalls('打开系统自动执行');
render();if(_ir0.n)toast('已自动返还到期活动款 '+_ir0.n+' 期，共 '+money(_ir0.sum));
</script>
